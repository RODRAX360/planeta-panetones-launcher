name: Compilar instalador Windows

on:
  push:
    branches: [main]
    paths:
      - version.py
      - main.py
      - launcher_updates.py
      - build_windows.py
      - tests/test_windows_updater.py
      - .github/workflows/instalador-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Validar actualización de Windows
        run: python -m unittest discover -s tests -p test_windows_updater.py -q
      - name: Validar inicio de sesión Microsoft
        run: python -m unittest discover -s tests -p test_microsoft_login.py -q
      - name: Compilar instalador y manifiesto
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/main"
          $installer = "https://github.com/${{ github.repository }}/releases/download/launcher-v$version"
          python build_release_windows.py --base-url $base --installer-base-url $installer
      - name: Publicar instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $tag = "launcher-v$version"
          $exe = "dist/PlanetaPanetones-Setup-$version.exe"
          gh release create $tag $exe --title "Planeta Panetones $version" --notes "Instalador ligero para Windows. Las instancias se descargan al pulsar Jugar."
      - name: Publicar aviso de actualización
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python publish_update_manifest.py dist/launcher-update.json launcher-update.json
      - name: Adjuntar descarga
        uses: actions/upload-artifact@v4
        with:
          name: PlanetaPanetones-Windows
          path: |
            dist/PlanetaPanetones-Setup-*.exe
            dist/launcher-update.json
          if-no-files-found: error
