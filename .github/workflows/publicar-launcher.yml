name: Publicar launcher y actualizaciones

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - launcher-update.json
      - launcher-update-linux.json
      - manifest.json
      - optimizado/manifest.json
  workflow_dispatch:

permissions:
  contents: write

# A later commit must never publish an older update feed before this run finishes.
concurrency:
  group: planeta-panetones-launcher-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      number: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar publicación automática
        run: |
          python -m unittest discover -s tests -p test_ci_release_version.py -q
          python -m unittest discover -s tests -p test_publish_update_manifest.py -q
      - name: Elegir versión posterior a las ya publicadas
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci_release_version.py prepare

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Marcar versión del ejecutable
        run: python ci_release_version.py stamp "${{ needs.version.outputs.number }}"
      - name: Instalar NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Validar actualización e inicio de sesión
        run: |
          python -m unittest discover -s tests -p test_windows_updater.py -q
          python -m unittest discover -s tests -p test_microsoft_login.py -q
          python -m unittest discover -s tests -p test_stable_release.py -q
      - name: Compilar instalador y manifiesto
        shell: pwsh
        run: |
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/main"
          $installer = "https://github.com/${{ github.repository }}/releases/download/launcher"
          python build_release_windows.py --base-url $base --installer-base-url $installer
      - name: Guardar instalador y manifiesto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-windows
          path: |
            dist/PlanetaPanetones-Setup.exe
            dist/launcher-update.json
          compression-level: 0
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Marcar versión del ejecutable
        run: python ci_release_version.py stamp "${{ needs.version.outputs.number }}"
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libnss3
          python -m pip install -r requirements.txt pyinstaller
      - name: Validar inicio de sesión y versión
        run: |
          python -m unittest discover -s tests -p test_microsoft_login.py -q
          python -m unittest discover -s tests -p test_stable_release.py -q
      - name: Obtener appimagetool verificado
        run: |
          curl --fail --location --retry 3 --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage' | sha256sum --check
          chmod +x appimagetool-x86_64.AppImage
      - name: Compilar AppImage y manifiesto
        run: |
          python build_linux.py --appimagetool ./appimagetool-x86_64.AppImage
          python release_launcher_linux.py
      - name: Probar arranque empaquetado
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/PlanetaPanetones-*-x86_64.AppImage --self-test
      - name: Guardar AppImage y manifiesto de Linux
        uses: actions/upload-artifact@v4
        with:
          name: launcher-build-linux
          path: |
            dist/PlanetaPanetones-x86_64.AppImage
            dist/launcher-update-linux.json
          compression-level: 0
          if-no-files-found: error

  promote:
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: launcher-build-windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: launcher-build-linux
          path: artifacts/linux
      - name: Validar artefactos y evitar sobrescribir una actualización posterior
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from ci_release_version import published_versions, version_parts

          repository = os.environ['GITHUB_REPOSITORY']
          version = os.environ['RELEASE_VERSION']
          base = f'https://github.com/{repository}/releases/download/launcher/'
          for platform, filename, manifest_name in (
              ('windows', 'PlanetaPanetones-Setup.exe', 'launcher-update.json'),
              ('linux', 'PlanetaPanetones-x86_64.AppImage', 'launcher-update-linux.json'),
          ):
              directory = Path('artifacts') / platform
              binary = directory / filename
              manifest = json.loads((directory / manifest_name).read_text(encoding='utf-8'))
              expected = manifest['installer']
              if manifest['version'] != version or expected['url'] != base + filename:
                  raise SystemExit(f'Manifiesto inesperado: {manifest_name}')
              if expected['size'] != binary.stat().st_size:
                  raise SystemExit(f'Tamaño distinto: {filename}')
              digest = hashlib.sha256()
              with binary.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              if expected['sha256'] != digest.hexdigest():
                  raise SystemExit(f'Hash distinto: {filename}')
          newer = any(published > version_parts(version)
                      for published in published_versions(repository, os.environ['GH_TOKEN']))
          remote_head = subprocess.check_output(
              ['git', 'ls-remote', 'origin', 'refs/heads/main'], text=True,
          ).split()[0]
          stale_source = remote_head != os.environ['GITHUB_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'skip={str(newer or stale_source).lower()}\n')
          if newer or stale_source:
              print('Esta ejecución ya no corresponde al código actual; se conserva el launcher publicado.')
          PY
      - name: Crear la única descarga pública si aún no existe
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view launcher >/dev/null 2>&1; then
            gh release create launcher --target "${{ github.sha }}" \
              --title 'Planeta Panetones' --latest \
              --notes 'Descarga el launcher una vez. Al abrirlo, buscará actualizaciones automáticamente. Las instancias se sincronizan al pulsar Jugar.'
          fi
          gh release edit launcher --latest
      - name: Publicar instalador de Windows
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload launcher artifacts/windows/PlanetaPanetones-Setup.exe --clobber
      - name: Anunciar actualización de Windows
        if: steps.preflight.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_update_manifest.py artifacts/windows/launcher-update.json launcher-update.json
      - name: Publicar AppImage de Linux
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload launcher artifacts/linux/PlanetaPanetones-x86_64.AppImage --clobber
      - name: Anunciar actualización de Linux
        if: steps.preflight.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_update_manifest.py artifacts/linux/launcher-update-linux.json launcher-update-linux.json
